name: CI

# Typecheck and build against the library's source, checked out side by side
# exactly as on a developer machine. Deploys are Vercel's job (vercel.json).
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: pinfold-ui }
      - uses: actions/checkout@v7
        with: { repository: '${{ github.repository_owner }}/pinfold', path: pinfold }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pinfold-ui/package-lock.json
            pinfold/package-lock.json
      - run: npm ci && npm run build
        working-directory: pinfold
      - run: npm ci
        working-directory: pinfold-ui
      - run: npm audit --audit-level=low
        working-directory: pinfold-ui
      - run: npm run typecheck && npm run build
        working-directory: pinfold-ui
