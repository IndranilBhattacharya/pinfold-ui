name: CI

# Typecheck and build against the library's source, checked out side by side
# exactly as on a developer machine. Deploys are Vercel's job (vercel.json).
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: lumae-site }
      - uses: actions/checkout@v4
        with: { repository: '${{ github.repository_owner }}/lumae', path: lumae }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lumae-site/package-lock.json
            lumae/package-lock.json
      - run: npm ci
        working-directory: lumae
      - run: npm ci
        working-directory: lumae-site
      - run: npm run typecheck && npm run build
        working-directory: lumae-site
